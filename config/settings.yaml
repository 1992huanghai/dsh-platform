# DeepSeek Harness 模型路由。
# 由 scripts/start.sh 同步到 $DSH_HOME/settings.yaml，不要把真实 Key 写进本文件。

llm-pi-ai:
  providers:
    siliconflow:
      displayName: SiliconFlow
      apiKeyEnv: SILICONFLOW_API_KEY
      api: openai-completions
      baseURL: https://api.siliconflow.cn/v1
      compat:
        thinkingFormat: deepseek
        maxTokensField: max_tokens
      models:
        - id: deepseek-ai/DeepSeek-V4-Flash
          name: DeepSeek-V4-Flash
          contextWindow: 1048576
          maxTokens: 8192

    # 第一期占位：把 id 改成本机 `GET /v1/models` 返回的真实值后再启用。
    ollama:
      displayName: Ollama（占位）
      apiKeyEnv: OLLAMA_API_KEY
      api: openai-completions
      baseURL: http://127.0.0.1:11434/v1
      compat:
        supportsDeveloperRole: false
        maxTokensField: max_tokens
      models:
        - id: placeholder/ollama-model
          name: Ollama Placeholder
          contextWindow: 32768
          maxTokens: 4096

    vllm:
      displayName: vLLM（占位）
      apiKeyEnv: VLLM_API_KEY
      api: openai-completions
      baseURL: http://127.0.0.1:8000/v1
      compat:
        supportsDeveloperRole: false
        maxTokensField: max_tokens
      models:
        - id: placeholder/vllm-model
          name: vLLM Placeholder
          contextWindow: 32768
          maxTokens: 4096

agent-default-model:
  provider: siliconflow
  model: deepseek-ai/DeepSeek-V4-Flash
